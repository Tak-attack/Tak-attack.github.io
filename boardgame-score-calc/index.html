<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>ボードゲーム専用電卓（Boardgame Score Calc）</title>
<style>
  :root{ color-scheme: light dark; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    overflow:hidden; overscroll-behavior:none; position:fixed; inset:0; width:100%;
  }
  button{ font-family:inherit; cursor:pointer; }
  button, [role="button"], select, input:not([type="checkbox"]){ min-height:2.25rem; }

  /* ---------- themes ---------- */
  body[data-theme="navy"]{ --bg:#0c1a3d; --bg2:#12255a; --surface:#16295c; --surface2:#1d3470; --line:#33509c; --text:#eef2ff; --sub:#a9bce8; --accent:#f2b33d; --accent-text:#231a00; --key:#22397a; --key-op:#2c4a9e; --danger:#ff7a7a; --win-bg:rgba(22,41,92,.55); }
  body[data-theme="light"]{ --bg:#eef1f5; --bg2:#e2e8f0; --surface:#ffffff; --surface2:#f2f5f9; --line:#c9d4e2; --text:#1c2733; --sub:#5d7186; --accent:#0b6bcb; --accent-text:#ffffff; --key:#e8eef6; --key-op:#d3e2f5; --danger:#c62f2f; --win-bg:rgba(255,255,255,.55); }
  body[data-theme="dark"]{ --bg:#101214; --bg2:#17191d; --surface:#1e2228; --surface2:#262b33; --line:#3a424e; --text:#eceff3; --sub:#9aa7b5; --accent:#ffb020; --accent-text:#241a00; --key:#2a3038; --key-op:#37404c; --danger:#ff8585; --win-bg:rgba(30,34,40,.55); }
  body[data-theme="paper"]{ --bg:#ece1c8; --bg2:#e3d5b4; --surface:#fffaf0; --surface2:#f7ecd4; --line:#cdbb92; --text:#38332a; --sub:#7a6f57; --accent:#b3541e; --accent-text:#fff8ec; --key:#f1e6cd; --key-op:#e7d7b2; --danger:#b02a1e; --win-bg:rgba(255,250,240,.55); }
  body{ background:var(--bg); color:var(--text); }
  body[data-opacity="standard"]{ --win-bg:var(--surface); }
  body[data-opacity="transparent"]{ --win-bg:color-mix(in srgb, var(--surface) 16%, transparent); }

  #loading{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--sub); font-size:1rem; z-index:200; }

  #app{ display:flex; flex-direction:column; height:100dvh; background:linear-gradient(180deg,var(--bg2),var(--bg)); }

  /* ---------- header ---------- */
  header{ display:flex; align-items:center; gap:.5rem; padding:.55rem .7rem; padding-top:calc(.55rem + env(safe-area-inset-top)); flex:0 0 auto; }
  #gameNameBtn{ flex:1 1 auto; min-width:0; text-align:left; background:var(--surface); color:var(--text); border:1.5px solid var(--line); border-radius:.7rem; padding:.45rem .8rem; font-size:1.08rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #gameNameBtn .placeholder{ color:var(--sub); font-weight:400; opacity:.75; }
  .icon-btn{ flex:0 0 auto; width:2.75rem; height:2.75rem; min-height:2.75rem; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:1.15rem; font-weight:700; padding:0; }
  .icon-btn svg{ width:1.3rem; height:1.3rem; display:block; }
  .icon-btn.active{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }

  /* ---------- table ---------- */
  #tableWrap{ flex:1 1 auto; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:0 .7rem; }
  #grid{ display:grid; gap:3px; width:100%; }
  .cell{ background:var(--surface); border:1px solid var(--line); border-radius:.45rem; display:flex; align-items:center; justify-content:center; min-height:3rem; padding:.2rem .3rem; text-align:center; overflow:hidden; }
  .cell.head{ background:var(--surface2); position:sticky; top:0; z-index:3; }
  .cell.corner{ position:sticky; left:0; top:0; z-index:5; font-size:.8rem; color:var(--sub); justify-content:center; }
  .cell.label{ position:sticky; left:0; z-index:2; justify-content:flex-start; text-align:left; background:var(--surface2); font-size:.92rem; font-weight:600; }
  .cell.label .lname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cell.total{ background:var(--surface2); font-weight:800; font-size:1.15rem; position:sticky; bottom:0; z-index:3; }
  .cell.total-label{ position:sticky; left:0; bottom:0; z-index:4; justify-content:flex-start; background:var(--surface2); font-weight:800; }
  .cell.score{ font-size:1.2rem; font-weight:700; background:var(--surface); border:1px solid var(--line); color:var(--text); width:100%; }
  .cell.score.selected{ outline:3px solid var(--accent); outline-offset:-1px; }
  .cell.score .expr{ font-size:.85rem; color:var(--sub); font-weight:400; word-break:break-all; }
  .frac{ font-size:.62em; color:var(--sub); font-weight:400; margin-left:.05em; }
  .pframe{ display:inline-block; border:3px solid #999; border-radius:.55rem; padding:.18rem .45rem; font-weight:800; font-size:1rem; line-height:1.25; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:var(--surface); }
  .badge{ flex:0 0 auto; font-size:.62rem; font-weight:800; border-radius:.35rem; padding:.08rem .3rem; margin-left:.35rem; letter-spacing:.02em; }
  .badge.tb{ background:var(--accent); color:var(--accent-text); }
  .minus-mark{ color:#e53935; font-weight:900; margin-left:.3rem; font-size:1.05rem; }
  .crown{ font-size:.95rem; margin-right:.15rem; }
  #winnerNote{ padding:.35rem .9rem 0; font-size:.88rem; color:var(--accent); font-weight:700; min-height:1.2rem; }
  body[data-theme="light"] #winnerNote, body[data-theme="paper"] #winnerNote{ color:var(--accent); }

  #actions{ flex:0 0 auto; display:flex; flex-wrap:wrap; gap:.5rem; padding:.55rem .7rem calc(.7rem + env(safe-area-inset-bottom)); }
  .act-btn{ flex:1 1 30%; background:var(--surface); color:var(--text); border:1.5px solid var(--line); border-radius:.7rem; padding:.55rem .4rem; font-size:.92rem; font-weight:700; }
  .act-btn.primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }

  /* ---------- keypad ---------- */
  #keypadWrap{ position:fixed; left:0; right:0; bottom:0; z-index:60; display:none; flex-direction:column; align-items:center; pointer-events:none; }
  #keypadWrap.open{ display:flex; }
  body[data-anim="on"] #keypadWrap.open{ animation:slideUp .22s ease-out; }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:.4; } to{ transform:translateY(0); opacity:1; } }
  #floatWin{ pointer-events:auto; width:min(94vw,30rem); background:var(--win-bg); border:1.5px solid var(--line); border-radius:.9rem; padding:.5rem .7rem; margin-bottom:.45rem; box-shadow:0 6px 24px rgba(0,0,0,.25); backdrop-filter:blur(2px); }
  #floatWin .fw-top{ display:flex; align-items:center; gap:.5rem; }
  #fwCell{ font-size:.8rem; color:var(--sub); flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #fwExpr{ font-size:1.05rem; min-height:1.5rem; word-break:break-all; margin-top:.15rem; }
  #fwResult{ font-size:1.45rem; font-weight:800; min-height:1.9rem; }
  #fwResult .lbl{ font-size:.8rem; color:var(--sub); font-weight:400; margin-right:.4rem; }
  .switch{ display:inline-flex; align-items:center; gap:.4rem; font-size:.85rem; font-weight:700; min-height:2.25rem; padding:.2rem .2rem; }
  .switch input{ width:1.3rem; height:1.3rem; accent-color:var(--accent); }
  #fwClose{ background:var(--accent); color:var(--accent-text); border:none; border-radius:.6rem; padding:.35rem .8rem; font-weight:800; font-size:.95rem; }
  #keypadBox{ pointer-events:auto; width:100%; background:var(--surface); border-top:1.5px solid var(--line); padding:0 .5rem calc(.5rem + env(safe-area-inset-bottom)); }
  #kpHandle{ height:1.4rem; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:grab; }
  #kpHandle::before{ content:""; width:3.2rem; height:.32rem; border-radius:1rem; background:var(--line); }
  #kpGrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:.4rem; max-width:34rem; margin:0 auto; }
  .key{ height:var(--keyh,54px); border:1px solid var(--line); border-radius:.65rem; background:var(--key); color:var(--text); font-size:1.3rem; font-weight:700; touch-action:none; user-select:none; -webkit-user-select:none; padding:0; }
  .key.op{ background:var(--key-op); font-size:1.15rem; }
  .key:active{ filter:brightness(1.25); }
  .key.span-r2{ grid-row:span 2; height:auto; }
  .key.span-c2{ grid-column:span 2; }
  #kpFooter{ display:flex; justify-content:flex-end; max-width:34rem; margin:.45rem auto 0; }
  #nextBtn{ background:var(--accent); color:var(--accent-text); border:none; border-radius:.7rem; padding:.6rem 1.1rem; font-size:1rem; font-weight:800; touch-action:none; user-select:none; }

  /* ---------- sheets ---------- */
  #overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:80; display:none; }
  #overlay.open{ display:block; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:90; background:var(--surface); color:var(--text); border-radius:1.1rem 1.1rem 0 0; border-top:1.5px solid var(--line); max-height:88dvh; display:none; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
  .sheet.open{ display:flex; }
  body[data-anim="on"] .sheet.open{ animation:slideUp .22s ease-out; }
  .sheet-head{ display:flex; align-items:center; gap:.5rem; padding:.8rem 1rem .4rem; }
  .sheet-head h2{ font-size:1.1rem; margin:0; flex:1 1 auto; }
  .sheet-close{ width:2.5rem; height:2.5rem; border-radius:50%; border:1.5px solid var(--line); background:var(--surface2); color:var(--text); font-size:1.05rem; }
  .sheet-body{ overflow-y:auto; overscroll-behavior:contain; padding:.4rem 1rem 1.1rem; }
  .sheet-body h3{ font-size:.85rem; color:var(--sub); margin:1rem 0 .45rem; letter-spacing:.04em; }
  .sheet-body h3:first-child{ margin-top:.2rem; }
  .seg{ display:flex; flex-wrap:wrap; gap:.4rem; }
  .seg button{ flex:1 1 auto; background:var(--surface2); color:var(--text); border:1.5px solid var(--line); border-radius:.6rem; padding:.5rem .5rem; font-size:.92rem; font-weight:600; }
  .seg button.sel{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .row-btn{ display:flex; align-items:center; gap:.6rem; width:100%; text-align:left; background:var(--surface2); color:var(--text); border:1.5px solid var(--line); border-radius:.7rem; padding:.65rem .8rem; font-size:.98rem; font-weight:600; margin-bottom:.45rem; }
  .row-btn .grow{ flex:1 1 auto; }
  .row-btn small{ color:var(--sub); font-weight:400; display:block; font-size:.8rem; }
  .danger{ color:var(--danger) !important; border-color:var(--danger) !important; }
  .armed{ background:var(--danger) !important; color:#fff !important; border-color:var(--danger) !important; }
  .txt-input{ width:100%; background:var(--surface2); color:var(--text); border:1.5px solid var(--line); border-radius:.6rem; padding:.55rem .7rem; font-size:1rem; margin-bottom:.6rem; }
  .swatches{ display:flex; flex-wrap:wrap; gap:.5rem; margin:.3rem 0 .7rem; }
  .swatch{ width:2.6rem; height:2.6rem; border-radius:50%; border:3px solid transparent; padding:0; position:relative; }
  .swatch.sel{ border-color:var(--text); }
  .swatch.auto{ width:auto; border-radius:1.3rem; padding:0 .8rem; background:var(--surface2); color:var(--text); border:1.5px solid var(--line); font-size:.85rem; font-weight:700; }
  .swatch.auto.sel{ background:var(--accent); color:var(--accent-text); }
  .radio-row{ display:flex; gap:.4rem; margin-bottom:.6rem; }
  .radio-row label{ flex:1; display:flex; align-items:center; justify-content:center; gap:.35rem; background:var(--surface2); border:1.5px solid var(--line); border-radius:.6rem; padding:.55rem .3rem; font-size:.92rem; font-weight:600; min-height:2.75rem; }
  .radio-row input{ width:1.15rem; height:1.15rem; accent-color:var(--accent); }
  .help-list{ margin:.2rem 0 .6rem; padding-left:1.2rem; }
  .help-list li{ margin-bottom:.35rem; line-height:1.55; font-size:.95rem; }
  table.detail{ border-collapse:collapse; width:100%; font-size:.9rem; }
  table.detail th, table.detail td{ border:1px solid var(--line); padding:.35rem .4rem; text-align:center; }
  table.detail th{ background:var(--surface2); }
  table.detail td.lbl, table.detail th.lbl{ text-align:left; }
  table.detail tr.total td{ font-weight:800; border-top:3px solid var(--text); }
  #toast{ position:fixed; left:50%; bottom:6.5rem; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:.55rem 1rem; border-radius:2rem; font-size:.9rem; font-weight:700; z-index:120; display:none; box-shadow:0 4px 16px rgba(0,0,0,.3); }
  #toast.show{ display:block; }

  /* ---------- print receipt ---------- */
  #printRoot{ display:none; }
  .receipt{ background:#fff; color:#000; width:80mm; max-width:100%; margin:0 auto; padding:6mm 4mm; font-family:"Hiragino Sans","Noto Sans JP",sans-serif; }
  .receipt h2{ font-size:15pt; margin:0 0 2mm; text-align:center; word-break:break-all; }
  .receipt .meta{ font-size:9.5pt; text-align:center; margin-bottom:3mm; }
  .receipt table{ border-collapse:collapse; width:100%; font-size:9.5pt; }
  .receipt th, .receipt td{ border:.6pt solid #000; padding:1.2mm 1mm; text-align:center; word-break:break-all; }
  .receipt td.lbl, .receipt th.lbl{ text-align:left; }
  .receipt tr.total td{ font-weight:700; border-top:2.2pt solid #000; }
  @media print{
    body > *:not(#printRoot){ display:none !important; }
    #printRoot{ display:block !important; }
    body{ position:static; overflow:visible; background:#fff; }
    @page{ size:80mm auto; margin:0; }
  }
</style>
</head>
<body data-theme="navy" data-opacity="semi" data-anim="on">
<div id="loading">読み込み中…</div>

<div id="app" style="visibility:hidden">
  <header>
    <button id="gameNameBtn" type="button"><span class="placeholder">ゲーム名</span></button>
    <button class="icon-btn" id="helpBtn" type="button" aria-label="ヘルプ">？</button>
    <button class="icon-btn" id="fsBtn" type="button" aria-label="フルスクリーン" style="display:none">
      <svg id="fsExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg>
      <svg id="fsShrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4"/></svg>
    </button>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="メニュー">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>
  <div id="winnerNote"></div>
  <div id="tableWrap"><div id="grid"></div><div id="kpSpacer" style="height:0"></div></div>
  <div id="actions">
    <button class="act-btn" id="addItemBtn" type="button">＋ 項目を追加</button>
    <button class="act-btn" id="addPlayerBtn" type="button">＋ プレイヤーを追加</button>
    <button class="act-btn primary" id="saveHistBtn" type="button">この結果を履歴に保存</button>
  </div>
</div>

<div id="keypadWrap">
  <div id="floatWin">
    <div class="fw-top">
      <span id="fwCell"></span>
      <label class="switch"><input type="checkbox" id="quickSwitch" />クイック</label>
      <button id="fwClose" type="button">決定</button>
    </div>
    <div id="fwExpr"></div>
    <div id="fwResult"></div>
  </div>
  <div id="keypadBox">
    <div id="kpHandle" title="ドラッグで高さ調整"></div>
    <div id="kpGrid"></div>
    <div id="kpFooter"><button id="nextBtn" type="button">次のプレイヤーへ →</button></div>
  </div>
</div>

<div id="overlay"></div>
<section class="sheet" id="sheet" aria-modal="true">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="sheet-close" id="sheetClose" type="button" aria-label="閉じる">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<div id="toast"></div>
<div id="printRoot"></div>

<script>
"use strict";
/* ================= data ================= */
var LS_KEY = "boardgame-score-calc-v1";
var COLORS = [
  {id:"red",    name:"赤",       hex:"#e53935"},
  {id:"blue",   name:"青",       hex:"#1e6fd9"},
  {id:"yellow", name:"黄",       hex:"#d9a400"},
  {id:"green",  name:"緑",       hex:"#2e9e4f"},
  {id:"orange", name:"オレンジ", hex:"#f07d1a"},
  {id:"purple", name:"紫",       hex:"#7b4fc9"},
  {id:"pink",   name:"ピンク",   hex:"#ec5fa0"},
  {id:"black",  name:"黒",       hex:"#26262b"}
];
function colorHex(id){ for(var i=0;i<COLORS.length;i++) if(COLORS[i].id===id) return COLORS[i].hex; return "#999"; }
var BUILTINS = [
  { name:"空欄", items:[{name:"",type:"normal"},{name:"",type:"normal"},{name:"",type:"normal"},{name:"",type:"normal"},{name:"",type:"normal"}] },
  { name:"アルナックの失われし遺跡", items:[["研究"],["寺院"],["偶像"],["守護者"],["アイテム/遺物"],["恐怖","minus"]].map(mkItem) },
  { name:"ウイングスパン", items:[["鳥カード"],["ボーナスカード"],["ラウンド終了時目的"],["卵"],["鳥カード上の餌"],["差し込んだ鳥カード"]].map(mkItem) },
  { name:"アグリコラ", items:[["畑"],["牧場"],["小麦"],["野菜"],["羊"],["猪"],["牛"],["未使用スペース"],["柵で囲まれた厩"],["レンガ/石の部屋"],["家族コマ"],["カード得点"],["ボーナス得点"],["物乞い","minus"]].map(mkItem) },
  { name:"オーディンの祝祭", items:[["船"],["移住"],["探検ボード"],["建物"],["動物"],["職業カード"],["銀貨"],["最終収入"],["イングランドの王冠"],["ホームボード","minus"],["探検ボード","minus"],["倉庫と家","minus"],["シングの罰則","minus"]].map(mkItem) },
  { name:"ヌースフィヨルド", items:[["船"],["建物"],["株券"],["金貨"],["空きスペース","minus"],["未発行株","minus"]].map(mkItem) },
  { name:"フォレストシャッフル", items:[["樹"],["湿原"],["上"],["左/右"],["下"],["洞窟"]].map(mkItem) },
  { name:"アークノヴァ・サンクチュアリ", items:[["動物タイル"],["建物タイル"],["計画タイル"],["空き地"],["保全功績"],["保全/育児嚢マーカー(2点)"],["ゲーム終了マーカー"],["ソロプレイマーカー"]].map(mkItem) }
];
function mkItem(a){ return { name:a[0], type:a[1]||"normal" }; }

var uidC = 1;
function uid(p){ return p + "-" + (Date.now().toString(36)) + "-" + (uidC++); }

function blankSheet(){
  return {
    gameName:"",
    players:[0,1,2,3].map(function(){ return { id:uid("p"), name:"", color:null }; }),
    items:[0,1,2,3,4].map(function(){ return { id:uid("i"), name:"", type:"normal" }; }),
    scores:{} /* itemId -> playerId -> {expr} */
  };
}
var state = blankSheet();
var settings = { theme:"navy", opacity:"semi", anim:true, keypadType:"keyboard", vibration:true, kpScale:1, quick:false };
var userPresets = []; /* {id,name,items,playerCount} */
var historyList = []; /* newest first, max 200 */

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({ state:state, settings:settings, userPresets:userPresets, history:historyList })); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d.state && d.state.players && d.state.items) state = d.state;
    if(d.settings) settings = Object.assign(settings, d.settings);
    if(Array.isArray(d.userPresets)) userPresets = d.userPresets;
    if(Array.isArray(d.history)) historyList = d.history;
  }catch(e){}
}

/* ================= expression eval (no eval) ================= */
function evaluate(expr){
  if(!expr) return null;
  var s = String(expr).replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/\s/g,"");
  if(!s) return null;
  var pos = 0;
  function peek(){ return s[pos]; }
  function parseExpr(){
    var v = parseTerm(); if(v===null) return null;
    while(peek()==="+"||peek()==="-"){ var op=s[pos++]; var r=parseTerm(); if(r===null) return null; v = op==="+"? v+r : v-r; }
    return v;
  }
  function parseTerm(){
    var v = parseFactor(); if(v===null) return null;
    while(peek()==="*"||peek()==="/"){ var op=s[pos++]; var r=parseFactor(); if(r===null) return null; v = op==="*"? v*r : (r===0? NaN : v/r); }
    return v;
  }
  function parseFactor(){
    var v = parsePrimary(); if(v===null) return null;
    while(peek()==="²"){ pos++; v = v*v; }
    return v;
  }
  function parsePrimary(){
    var c = peek();
    if(c==="-"){ pos++; var n=parsePrimary(); return n===null? null : -n; }
    if(c==="+"){ pos++; return parsePrimary(); }
    if(c==="("){ pos++; var v=parseExpr(); if(peek()!==")") return null; pos++; return v; }
    var m = /^[0-9]*\.?[0-9]+/.exec(s.slice(pos));
    if(!m) return null;
    pos += m[0].length;
    return parseFloat(m[0]);
  }
  var v = parseExpr();
  if(v===null || pos!==s.length || typeof v!=="number" || !isFinite(v)) return null;
  return v;
}
function cellExpr(itemId, playerId){
  var row = state.scores[itemId]; if(!row) return "";
  var c = row[playerId]; return c? (c.expr||"") : "";
}
function cellValue(itemId, playerId){ return evaluate(cellExpr(itemId, playerId)); }
function setCell(itemId, playerId, expr){
  if(!state.scores[itemId]) state.scores[itemId] = {};
  if(expr===""||expr===null||expr===undefined) delete state.scores[itemId][playerId];
  else state.scores[itemId][playerId] = { expr:String(expr) };
}

/* ================= formatting / totals ================= */
function fmtHTML(v){
  if(v===null||v===undefined||isNaN(v)) return "";
  var t = Math.trunc(v);
  var sign = t<0? "-" : (v<0 && t===0 ? "-" : "");
  var digits = String(Math.abs(t));
  if(digits.length>5) digits = digits.slice(0,5);
  var frac = Math.abs(v - Math.trunc(v));
  frac = Math.round(frac*10000)/10000;
  var out = sign + digits;
  if(frac>0 && frac<1){
    var fs = String(frac);
    var dec = fs.indexOf(".")>=0? fs.split(".")[1] : "";
    if(dec) out += '<span class="frac">.' + dec + "</span>";
  }
  return out;
}
function fmtText(v){
  if(v===null||v===undefined||isNaN(v)) return "";
  var t = Math.trunc(v);
  var digits = String(Math.abs(t)); if(digits.length>5) digits = digits.slice(0,5);
  var frac = Math.round(Math.abs(v-Math.trunc(v))*10000)/10000;
  var out = (t<0?"-":"") + digits;
  if(frac>0&&frac<1){ var fs=String(frac); if(fs.indexOf(".")>=0) out += "." + fs.split(".")[1]; }
  return out;
}
function truncVal(v){ return (v===null||v===undefined||isNaN(v))? 0 : Math.trunc(v); }
function playerTotal(pid){
  var sum = 0;
  state.items.forEach(function(it){
    if(it.type==="tb") return;
    var v = truncVal(cellValue(it.id, pid));
    sum += it.type==="minus"? -v : v;
  });
  return sum;
}
function computeWinners(){
  var totals = state.players.map(function(p){ return playerTotal(p.id); });
  if(totals.length && totals.every(function(t){ return t===0; })){
    return { totals:totals, winners:[], tbDecided:false };
  }
  var max = Math.max.apply(null, totals);
  var tied = state.players.filter(function(p,i){ return totals[i]===max; });
  var tbDecided = false;
  if(tied.length>1){
    var tbItems = state.items.filter(function(it){ return it.type==="tb"; });
    for(var k=0;k<tbItems.length;k++){
      var vals = tied.map(function(p){ return truncVal(cellValue(tbItems[k].id, p.id)); });
      var m = Math.max.apply(null, vals);
      var nt = tied.filter(function(p,i){ return vals[i]===m; });
      if(nt.length<tied.length){ tied = nt; tbDecided = true; }
      if(tied.length===1) break;
    }
  }
  return { totals:totals, winners:tied, tbDecided:tbDecided && tied.length===1 };
}
function playerDisplayName(p, idx){ return p.name? p.name : (idx+1)+"P"; }
function playerColor(p, idx){
  if(p.color) return colorHex(p.color);
  var used = {};
  state.players.forEach(function(q){ if(q.color) used[q.color]=true; });
  var free = COLORS.filter(function(c){ return !used[c.id]; });
  var autoCount = 0;
  for(var i=0;i<idx;i++){ if(!state.players[i].color) autoCount++; }
  var c = free.length? free[autoCount % free.length] : COLORS[idx % COLORS.length];
  return c.hex;
}

var kpWrap = document.getElementById("keypadWrap");
var kpGrid = document.getElementById("kpGrid");
var editExpr = "";
var quickValue = 0;
var quickPending = null; /* tens digit or null */
var kpOpen = false;

function buildKeypad(){
  var nums = settings.keypadType==="phone"
    ? [["1","2","3"],["4","5","6"],["7","8","9"]]
    : [["7","8","9"],["4","5","6"],["1","2","3"]];
  var html = "";
  html += '<button type="button" class="key op" data-k="paren">（ ）</button>';
  html += '<button type="button" class="key op" data-k="sq">x²</button>';
  html += '<button type="button" class="key op" data-k="op" data-v="÷">÷</button>';
  html += '<button type="button" class="key op" data-k="bs">⌫</button>';
  var ops = ["×","−","+"];
  for(var r=0;r<3;r++){
    for(var c=0;c<3;c++) html += '<button type="button" class="key" data-k="num" data-v="' + nums[r][c] + '">' + nums[r][c] + "</button>";
    if(r<2) html += '<button type="button" class="key op" data-k="op" data-v="' + ops[r] + '">' + ops[r] + "</button>";
    else html += '<button type="button" class="key op span-r2" data-k="op" data-v="+">+</button>';
  }
  html += '<button type="button" class="key span-c2" data-k="zero" data-v="0">0</button>';
  html += '<button type="button" class="key" data-k="dot">.</button>';
  kpGrid.innerHTML = html;
  kpGrid.querySelectorAll(".key").forEach(function(b){ attachKey(b); });
  applyKpScale();
}
function applyKpScale(){
  var h = Math.round(54 * (settings.kpScale||1));
  kpGrid.style.setProperty("--keyh", h + "px");
  document.documentElement.style.setProperty("--keyh", h + "px");
  kpGrid.querySelectorAll(".key").forEach(function(b){ b.style.height = h + "px"; });
  var plus = kpGrid.querySelector(".span-r2"); if(plus) plus.style.height = "auto";
}
function currentItem(){ return state.items.find(function(i){ return selected && i.id===selected.itemId; }); }
function currentPlayerIdx(){ return state.players.findIndex(function(p){ return selected && p.id===selected.playerId; }); }

function openKeypad(itemId, playerId){
  commitEdit();
  selected = { itemId:itemId, playerId:playerId };
  editExpr = cellExpr(itemId, playerId);
  var v = evaluate(editExpr);
  quickValue = v!==null? v : 0;
  quickPending = null;
  kpOpen = true;
  document.getElementById("quickSwitch").checked = !!settings.quick;
  kpWrap.classList.add("open");
  render(); updateFloatWin();
  requestAnimationFrame(function(){
    setKpSpacer();
    scrollSelectedIntoView();
  });
}
function setKpSpacer(){
  document.getElementById("kpSpacer").style.height = kpOpen? (kpWrap.offsetHeight + 16) + "px" : "0px";
}
function closeKeypad(){
  commitEdit();
  kpOpen = false; selected = null;
  kpWrap.classList.remove("open");
  setKpSpacer();
  render();
}
function commitEdit(){
  if(!kpOpen || !selected) return;
  var exists = state.items.some(function(i){ return i.id===selected.itemId; }) && state.players.some(function(p){ return p.id===selected.playerId; });
  if(!exists) return;
  if(settings.quick){ setCell(selected.itemId, selected.playerId, quickValue===0 && quickPending===null ? "" : String(quickValue)); }
  else setCell(selected.itemId, selected.playerId, editExpr);
  save();
}
function scrollSelectedIntoView(){
  if(!selected) return;
  var cell = gridEl.querySelector('[data-act="cell"][data-iid="' + selected.itemId + '"][data-pid="' + selected.playerId + '"]');
  if(!cell) return;
  var targetTop = cell.offsetTop - wrapEl.clientHeight/3;
  wrapEl.scrollTo({ top:Math.max(0,targetTop), behavior:"smooth" });
  var targetLeft = cell.offsetLeft - wrapEl.clientWidth/3;
  wrapEl.scrollTo({ left:Math.max(0,targetLeft), top:Math.max(0,targetTop), behavior:"smooth" });
}
function updateFloatWin(){
  var it = currentItem(); var pi = currentPlayerIdx();
  var p = state.players[pi];
  document.getElementById("fwCell").textContent =
    (p? playerDisplayName(p, pi) : "") + " × " + (it? (it.name || "項目") : "") + (it && it.type==="minus"? "（マイナス）":"") + (it && it.type==="tb"? "（TB）":"");
  var exprEl = document.getElementById("fwExpr");
  var resEl = document.getElementById("fwResult");
  if(settings.quick){
    exprEl.textContent = quickPending!==null? ("保留: " + quickPending + "_") : "数字タップでそのまま加算";
    resEl.innerHTML = '<span class="lbl">現在</span>' + fmtHTML(quickValue);
  } else {
    exprEl.textContent = editExpr || "式を入力";
    var v = evaluate(editExpr);
    resEl.innerHTML = '<span class="lbl">結果</span>' + (v!==null? fmtHTML(v) : "—");
  }
}

document.getElementById("quickSwitch").addEventListener("change", function(e){
  commitEdit();
  settings.quick = e.target.checked;
  if(settings.quick){ var v = evaluate(editExpr); quickValue = v!==null? v : 0; quickPending = null; }
  else { editExpr = quickValue? String(quickValue) : ""; }
  save(); updateFloatWin();
});

function endsWithValue(s){ return /[0-9.)²]$/.test(s.replace(/\s/g,"")); }
function parenAction(){
  var open = (editExpr.match(/\(/g)||[]).length;
  var close = (editExpr.match(/\)/g)||[]).length;
  if(open>close && endsWithValue(editExpr)) editExpr += ")";
  else if(endsWithValue(editExpr)) editExpr += "×(";
  else editExpr += "(";
}
function dotAction(){
  var seg = editExpr.split(/[+\-−×÷()]/).pop();
  if(seg.indexOf(".")>=0) return;
  if(!/[0-9]$/.test(editExpr)) editExpr += "0";
  editExpr += ".";
}
function keyAction(k, v, flick){
  vibrate();
  if(settings.quick){
    if(k==="num" || k==="zero"){
      var d = parseInt(v,10);
      if(quickPending!==null){ quickValue += quickPending*10 + d; quickPending = null; }
      else if(k==="zero"){ if(flick==="down"){ /* quick: dot ignored */ } else quickValue += 10; }
      else quickValue += d;
    } else if(k==="bs"){
      if(flick==="up"){ quickValue = 0; quickPending = null; }
      else if(quickPending!==null) quickPending = null;
    }
    updateFloatWin(); return;
  }
  switch(k){
    case "num": editExpr += v; break;
    case "zero":
      if(flick==="down") dotAction(); else editExpr += "0";
      break;
    case "dot": dotAction(); break;
    case "op":
      if(editExpr==="" && v!=="−") break;
      if(/[+\-−×÷]$/.test(editExpr)) editExpr = editExpr.slice(0,-1) + v;
      else editExpr += v;
      break;
    case "paren": parenAction(); break;
    case "sq": if(endsWithValue(editExpr)) editExpr += "²"; break;
    case "bs":
      if(flick==="up") editExpr = "";
      else editExpr = editExpr.slice(0,-1);
      break;
  }
  updateFloatWin();
}
function attachKey(btn){
  var startX=0, startY=0, lpTimer=null, lpFired=false;
  btn.addEventListener("pointerdown", function(e){
    startX = e.clientX; startY = e.clientY; lpFired = false;
    if(settings.quick && btn.getAttribute("data-k")==="num"){
      var d = parseInt(btn.getAttribute("data-v"),10);
      lpTimer = setTimeout(function(){
        lpFired = true; quickPending = d; vibrate(35); updateFloatWin();
      }, 450);
    }
  });
  btn.addEventListener("pointerup", function(e){
    if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; }
    if(lpFired) return;
    var dx = e.clientX - startX, dy = e.clientY - startY;
    var flick = null;
    if(dy < -26 && Math.abs(dy) > Math.abs(dx)) flick = "up";
    else if(dy > 26 && Math.abs(dy) > Math.abs(dx)) flick = "down";
    keyAction(btn.getAttribute("data-k"), btn.getAttribute("data-v"), flick);
  });
  btn.addEventListener("pointercancel", function(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } });
  btn.addEventListener("contextmenu", function(e){ e.preventDefault(); });
}

function moveSelection(dir){

  var idx = cells.findIndex(function(c){ return c.itemId===selected.itemId && c.playerId===selected.playerId; });

  selected = cells[ni];

  render(); updateFloatWin();

/* keypad height handle */
(function(){
  var handle = document.getElementById("kpHandle");
  var startY=0, startScale=1, dragging=false, lastTap=0;
  handle.addEventListener("pointerdown", function(e){
    dragging = true; startY = e.clientY; startScale = settings.kpScale||1;
    handle.setPointerCapture(e.pointerId);
    var now = Date.now();
    if(now - lastTap < 350){ settings.kpScale = 1; applyKpScale(); save(); refreshKpPadding(); }
    lastTap = now;
  });
  handle.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var s = startScale + (startY - e.clientY)/260;
    settings.kpScale = Math.min(1.5, Math.max(0.6, s));
    applyKpScale(); refreshKpPadding();
  });
  handle.addEventListener("pointerup", function(){ dragging=false; save(); });
  handle.addEventListener("dblclick", function(){ settings.kpScale = 1; applyKpScale(); save(); refreshKpPadding(); });
})();

    '<div class="radio-row">' +
    '<label><input type="radio" name="ieType" value="normal"' + (it.type==="normal"?" checked":"") + ">通常</label>" +
    '<label><input type="radio" name="ieType" value="minus"' + (it.type==="minus"?" checked":"") + ">マイナス項目</label>" +
    '<label><input type="radio" name="ieType" value="tb"' + (it.type==="tb"?" checked":"") + ">タイブレーク</label>" +
    "</div>" +
    '<p style="font-size:.85rem;color:var(--sub);line-height:1.5;margin:.1rem 0 .7rem">マイナス項目は合計から差し引かれます。タイブレーク項目は合計に入らず、同点のときに上から順に比べて順位を決めます。</p>' +
    '<button class="row-btn" id="ieSave" type="button"><span class="grow">保存する</span></button>' +
    (state.items.length>1? '<button class="row-btn danger" id="ieDel" type="button"><span class="grow">この項目を削除</span></button>' : ""));
  document.getElementById("ieSave").addEventListener("click", function(){
    it.name = document.getElementById("ieName").value;
    var r = sheetBody.querySelector('input[name="ieType"]:checked');
    it.type = r? r.value : "normal";
    save(); render(); closeSheet();
  });
  var del = document.getElementById("ieDel");
  if(del) armable(del, "もう一度タップで削除", function(){
    state.items = state.items.filter(function(x){ return x.id!==iid; });
    delete state.scores[iid];
    if(selected && selected.itemId===iid) closeKeypad();
    save(); render(); closeSheet(); toast("項目を削除しました");
  });
}

/* ---- menu ---- */
document.getElementById("menuBtn").addEventListener("click", openMenu);
function segHTML(group, options, current){
  var h = '<div class="seg" data-group="' + group + '">';
  options.forEach(function(o){ h += '<button type="button" data-val="' + o[0] + '"' + (current===o[0]? ' class="sel"':"") + ">" + o[1] + "</button>"; });
  return h + "</div>";
}
function openMenu(){
  var html = "";
  html += "<h3>表示</h3>";
  html += '<p style="margin:.1rem 0 .35rem;font-size:.88rem;color:var(--sub)">テーマ</p>' +
    segHTML("theme", [["navy","濃紺"],["light","ライト"],["dark","ダーク"],["paper","ペーパー"]], settings.theme);
  html += '<p style="margin:.6rem 0 .35rem;font-size:.88rem;color:var(--sub)">窓の透明度</p>' +
    segHTML("opacity", [["standard","標準"],["semi","半透明"],["transparent","透明"]], settings.opacity);
  html += '<p style="margin:.6rem 0 .35rem;font-size:.88rem;color:var(--sub)">アニメーション</p>' +
    segHTML("anim", [["on","ON"],["off","OFF"]], settings.anim? "on":"off");
  html += "<h3>データ</h3>";
  html += '<button class="row-btn" id="mPreset" type="button"><span class="grow">プリセット<small>ゲームごとの項目構成を読み込み・保存</small></span>›</button>';
  html += '<button class="row-btn" id="mHistory" type="button"><span class="grow">履歴<small>保存した対戦結果を見る</small></span>›</button>';
  html += "<h3>入力</h3>";
  html += '<p style="margin:.1rem 0 .35rem;font-size:.88rem;color:var(--sub)">テンキータイプ</p>' +
    segHTML("keypadType", [["keyboard","キーボード式（7-8-9上段）"],["phone","電話式（1-2-3上段）"]], settings.keypadType);
  html += '<p style="margin:.6rem 0 .35rem;font-size:.88rem;color:var(--sub)">振動フィードバック</p>' +
    segHTML("vibration", [["on","ON"],["off","OFF"]], settings.vibration? "on":"off");
  html += '<button class="row-btn danger" id="mClear" type="button" style="margin-top:1.2rem"><span class="grow">全消去<small>表を初期状態（空欄）に戻します</small></span></button>';
  openSheet("メニュー", html);
  sheetBody.querySelectorAll(".seg").forEach(function(seg){
    seg.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        var g = seg.getAttribute("data-group"), v = b.getAttribute("data-val");
        seg.querySelectorAll("button").forEach(function(x){ x.classList.remove("sel"); });
        b.classList.add("sel"); vibrate();
        if(g==="theme"){ settings.theme = v; applySettings(); }
        if(g==="opacity"){ settings.opacity = v; applySettings(); }
        if(g==="anim"){ settings.anim = v==="on"; applySettings(); }
        if(g==="keypadType"){ settings.keypadType = v; buildKeypad(); if(kpOpen) refreshKpPadding(); }
        if(g==="vibration"){ settings.vibration = v==="on"; }
        save();
      });
    });
  });
  document.getElementById("mPreset").addEventListener("click", openPresets);
  document.getElementById("mHistory").addEventListener("click", openHistory);
  armable(document.getElementById("mClear"), "もう一度タップで全消去", function(){
    closeKeypad();
    state = blankSheet();
    save(); render(); closeSheet(); toast("全消去しました");
  });
}
function applySettings(){
  document.body.setAttribute("data-theme", settings.theme);
  document.body.setAttribute("data-opacity", settings.opacity);
  document.body.setAttribute("data-anim", settings.anim? "on":"off");
}

/* ---- help ---- */
document.getElementById("helpBtn").addEventListener("click", function(){
  var html = "";
  html += "<h3>特徴</h3><ul class=\"help-list\">" +
    "<li>プレイヤー（列）×項目（行）の得点表で、合計は自動計算。1位には王冠が付きます</li>" +
    "<li>小数は切り捨てで計算し、小数部分は小さく薄く併記します</li>" +
    "<li>マイナス項目（合計から差し引き）とタイブレーク項目（同点時に上から順に比較）を設定できます</li>" +
    "<li>入力内容や設定はこのブラウザ内に自動保存されます</li></ul>";
  html += "<h3>基本の使い方</h3><ul class=\"help-list\">" +
    "<li>スコアのセルをタップするとテンキーが開きます。式を入力すると結果がその場で計算されます</li>" +
    "<li>ゲーム名・プレイヤー名・項目名はタップで編集できます（プレイヤー名は4文字まで、色も選べます）</li>" +

    "<li>項目・プレイヤーは下のボタンから追加できます</li></ul>";
  html += "<h3>テンキーの操作</h3><ul class=\"help-list\">" +
    "<li>⌫：タップで1文字削除、上フリックで全消去（AC）</li>" +
    "<li>0キー：下フリックで小数点を入力</li>" +
    "<li>（ ）キー：状況に応じて開く／閉じるを自動判定します</li>" +
    "<li>x²キー：直前の値を2乗します</li>" +
    "<li>キーパッド上端のバーを上下にドラッグするとキーの高さを変えられます（ダブルタップで100%に戻ります）</li></ul>";
  html += "<h3>クイックモード</h3><ul class=\"help-list\">" +
    "<li>テンキー上の窓のスイッチで切替。数字をタップするたび、その数字がそのまま加算されます（0は10点）</li>" +
    "<li>2桁の点数は、十の位の数字を長押し（「1_」のように保留表示）してから一の位をタップします</li>" +
    "<li>保留は⌫でキャンセルできます</li></ul>";
  html += "<h3>プリセット・履歴・印刷</h3><ul class=\"help-list\">" +
    "<li>メニューからプリセットの読み込みや、今の構成の保存ができます</li>" +
    "<li>「この結果を履歴に保存」で結果を残せます（最大200件）。履歴からは項目別の内訳確認と印刷ができます</li>" +
    "<li>印刷は80mmレシート幅の白黒表形式です</li></ul>";
  openSheet("ヘルプ", html);
});

/* ---- presets ---- */
function applyPreset(name, items, playerCount){
  closeKeypad();
  var pc = playerCount || 4;
  var players = [];
  for(var i=0;i<pc;i++) players.push({ id:uid("p"), name:"", color:null });
  state = {
    gameName: name==="空欄"? "" : name,
    players: players,
    items: items.map(function(it){ return { id:uid("i"), name:it.name, type:it.type||"normal" }; }),
    scores:{}
  };
  save(); render(); closeSheet(); toast("プリセット「" + name + "」を読み込みました");
}
function openPresets(){
  var html = "<h3>組み込みプリセット</h3>";
  BUILTINS.forEach(function(b, i){
    html += '<button class="row-btn preset-load" type="button" data-kind="builtin" data-idx="' + i + '"><span class="grow">' + escapeHtml(b.name) + "<small>項目" + b.items.length + "・4人</small></span></button>";
  });
  html += "<h3>マイプリセット</h3>";
  if(!userPresets.length) html += '<p style="color:var(--sub);font-size:.9rem">まだ保存したプリセットはありません。</p>';
  userPresets.forEach(function(pr){
    html += '<div style="display:flex;gap:.4rem;margin-bottom:.45rem">' +
      '<button class="row-btn preset-load" type="button" data-kind="user" data-id="' + pr.id + '" style="flex:1;margin-bottom:0"><span class="grow">' + escapeHtml(pr.name) + "<small>項目" + pr.items.length + "・" + pr.playerCount + "人</small></span></button>" +
      '<button class="row-btn danger preset-del" type="button" data-id="' + pr.id + '" style="flex:0 0 auto;width:auto">削除</button></div>';
  });
  html += "<h3>現在の構成を保存</h3>" +
    '<input class="txt-input" id="prName" type="text" placeholder="プリセット名" />' +
    '<button class="row-btn" id="prSave" type="button"><span class="grow">この構成をプリセットとして保存</span></button>' +
    '<p style="font-size:.83rem;color:var(--sub)">保存されるのは項目構成と人数のみで、スコアや名前は含まれません。読み込み・削除は2回タップの確認式です。</p>';
  openSheet("プリセット", html);
  sheetBody.querySelectorAll(".preset-load").forEach(function(b){
    armable(b, "もう一度タップで読み込み", function(){
      if(b.getAttribute("data-kind")==="builtin"){
        var bp = BUILTINS[parseInt(b.getAttribute("data-idx"),10)];
        applyPreset(bp.name, bp.items, 4);
      } else {
        var up = userPresets.find(function(x){ return x.id===b.getAttribute("data-id"); });
        if(up) applyPreset(up.name, up.items, up.playerCount);
      }
    });
  });
  sheetBody.querySelectorAll(".preset-del").forEach(function(b){
    armable(b, "もう一度タップ", function(){
      userPresets = userPresets.filter(function(x){ return x.id!==b.getAttribute("data-id"); });
      save(); openPresets(); toast("プリセットを削除しました");
    });
  });
  document.getElementById("prSave").addEventListener("click", function(){
    var nm = document.getElementById("prName").value.trim();
    if(!nm){ toast("プリセット名を入力してください"); return; }
    userPresets.push({ id:uid("pr"), name:nm,
      items: state.items.map(function(it){ return { name:it.name, type:it.type }; }),
      playerCount: state.players.length });
    save(); openPresets(); toast("プリセットを保存しました");
  });
}

/* ---- history ---- */
function snapshotEntry(){
  var w = computeWinners();
  return {
    id: uid("h"), ts: Date.now(),
    gameName: state.gameName,
    players: state.players.map(function(p,i){ return { name:playerDisplayName(p,i), color:playerColor(p,i) }; }),
    items: state.items.map(function(it){ return { name:it.name, type:it.type }; }),
    values: state.items.map(function(it){ return state.players.map(function(p){ return cellValue(it.id, p.id); }); }),
    totals: w.totals,
    winners: w.winners.map(function(p){ return playerDisplayName(p, state.players.indexOf(p)); })
  };
}
function saveToHistory(){
  var e = snapshotEntry();
  historyList.unshift(e);
  if(historyList.length>200) historyList = historyList.slice(0,200);
  save(); toast("履歴に保存しました");
}
function fmtDate(ts){
  var d = new Date(ts);
  function z(x){ return (x<10? "0":"") + x; }
  return d.getFullYear() + "/" + z(d.getMonth()+1) + "/" + z(d.getDate()) + " " + z(d.getHours()) + ":" + z(d.getMinutes());
}
function openHistory(){
  var html = "";
  if(!historyList.length) html += '<p style="color:var(--sub);font-size:.9rem">履歴はまだありません。「この結果を履歴に保存」ボタンで保存できます。</p>';
  historyList.forEach(function(e){
    html += '<div style="border:1.5px solid var(--line);border-radius:.7rem;padding:.6rem .7rem;margin-bottom:.55rem">' +
      '<div style="font-weight:800">' + escapeHtml(e.gameName || "ゲーム名なし") + "</div>" +
      '<div style="font-size:.82rem;color:var(--sub)">' + fmtDate(e.ts) + "・" + e.players.length + "人・優勝: " + escapeHtml(e.winners.join("・") || "—") + "</div>" +
      '<div style="display:flex;gap:.4rem;margin-top:.5rem">' +
      '<button class="row-btn hist-detail" type="button" data-id="' + e.id + '" style="flex:1;margin-bottom:0;padding:.45rem .5rem">詳細</button>' +
      '<button class="row-btn hist-print" type="button" data-id="' + e.id + '" style="flex:1;margin-bottom:0;padding:.45rem .5rem">印刷</button>' +
      '<button class="row-btn danger hist-del" type="button" data-id="' + e.id + '" style="flex:1;margin-bottom:0;padding:.45rem .5rem">削除</button>' +
      "</div></div>";
  });
  openSheet("履歴", html);
  sheetBody.querySelectorAll(".hist-detail").forEach(function(b){
    b.addEventListener("click", function(){
      var e = historyList.find(function(x){ return x.id===b.getAttribute("data-id"); });
      if(e) openHistoryDetail(e);
    });
  });
  sheetBody.querySelectorAll(".hist-print").forEach(function(b){
    b.addEventListener("click", function(){
      var e = historyList.find(function(x){ return x.id===b.getAttribute("data-id"); });
      if(e) openPrintPreview(e);
    });
  });
  sheetBody.querySelectorAll(".hist-del").forEach(function(b){
    armable(b, "もう一度タップ", function(){
      historyList = historyList.filter(function(x){ return x.id!==b.getAttribute("data-id"); });
      save(); openHistory(); toast("履歴を削除しました");
    });
  });
}
function detailTableHTML(e){
  var html = '<table class="detail"><tr><th class="lbl">項目</th>';
  e.players.forEach(function(p){ html += "<th>" + escapeHtml(p.name) + "</th>"; });
  html += "</tr>";
  e.items.forEach(function(it, ri){
    var lbl = it.name || (ri+1)+".";
    if(it.type==="minus") lbl += " (−)";
    if(it.type==="tb") lbl += " (TB)";
    html += '<tr><td class="lbl">' + escapeHtml(lbl) + "</td>";
    e.values[ri].forEach(function(v){
      var disp = v===null||v===undefined? "" : fmtText(it.type==="minus"? -Math.abs(v) : v);
      html += "<td>" + disp + "</td>";
    });
    html += "</tr>";
  });
  html += '<tr class="total"><td class="lbl">合計</td>';
  e.totals.forEach(function(t, i){
    var win = e.winners.indexOf(e.players[i].name)>=0;
    html += "<td>" + (win? "👑 " : "") + fmtText(t) + "</td>";
  });
  html += "</tr></table>";
  return html;
}
function openHistoryDetail(e){
  var html = '<p style="margin:.1rem 0 .6rem;color:var(--sub);font-size:.88rem">' + fmtDate(e.ts) + "・" + e.players.length + "人・優勝: " + escapeHtml(e.winners.join("・") || "—") + "</p>" +
    detailTableHTML(e) +
    '<button class="row-btn" id="hdPrint" type="button" style="margin-top:.8rem"><span class="grow">印刷する</span></button>' +
    '<button class="row-btn" id="hdBack" type="button"><span class="grow">履歴一覧に戻る</span></button>';
  openSheet(e.gameName || "ゲーム名なし", html);
  document.getElementById("hdPrint").addEventListener("click", function(){ openPrintPreview(e); });
  document.getElementById("hdBack").addEventListener("click", openHistory);
}

/* ---- print ---- */
function receiptHTML(e){
  var html = '<div class="receipt"><h2>' + escapeHtml(e.gameName || "ゲーム名") + "</h2>" +
    '<div class="meta">' + fmtDate(e.ts) + "　" + e.players.length + "人</div><table><tr><th class=\"lbl\">項目</th>";
  e.players.forEach(function(p){ html += "<th>" + escapeHtml(p.name) + "</th>"; });
  html += "</tr>";
  e.items.forEach(function(it, ri){
    var lbl = it.name || (ri+1)+".";
    if(it.type==="minus") lbl += " (−)";
    html += '<tr><td class="lbl">' + escapeHtml(lbl) + "</td>";
    e.values[ri].forEach(function(v){
      var disp = v===null||v===undefined? "" : fmtText(it.type==="minus"? -Math.abs(v) : v);
      html += "<td>" + disp + "</td>";
    });
    html += "</tr>";
  });
  html += '<tr class="total"><td class="lbl">合計</td>';
  e.totals.forEach(function(t, i){
    var win = e.winners.indexOf(e.players[i].name)>=0;
    html += "<td>" + (win? "👑 " : "") + fmtText(t) + "</td>";
  });
  html += "</tr></table></div>";
  return html;
}
function openPrintPreview(e){
  var html = '<div style="background:#fff;border-radius:.5rem;padding:.4rem;margin-bottom:.8rem">' + receiptHTML(e) + "</div>" +
    '<button class="row-btn" id="ppPrint" type="button"><span class="grow">印刷ダイアログを開く</span></button>' +
    '<p style="font-size:.83rem;color:var(--sub)">80mmレシート幅想定の白黒レイアウトです。</p>';
  openSheet("印刷プレビュー", html);
  document.getElementById("ppPrint").addEventListener("click", function(){
    document.getElementById("printRoot").innerHTML = receiptHTML(e);
    window.print();
  });
}

load();
applySettings();
buildKeypad();
render();
requestAnimationFrame(function(){
  setTimeout(function(){
    document.getElementById("app").style.visibility = "visible";
    document.getElementById("loading").style.display = "none";
  }, 30);
});
